<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Praxis</title>
<link rel="icon" href="https://prostplanetevo-sudo.github.io/praxis/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F8FD;--fg:#0F2A57;--muted:#51607A;--brand:#1F5DB3;--on-brand:#fff;--line:#DBE6F4;--accent:#8FD97F}
@media (prefers-color-scheme:dark){:root{--bg:#0A1B3C;--fg:#fff;--muted:#A9BCDB;--brand:#5CC8EE;--on-brand:#0A1B3C;--line:#1E3D73;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:400 17px/1.6 Inter,Arial,sans-serif}
main{max-width:520px;text-align:center}
svg{width:64px;height:auto;margin-bottom:24px}
h1{margin:0 0 12px;font:800 clamp(34px,8vw,48px)/1.1 Montserrat,Arial,sans-serif}
p{margin:0 0 28px;color:var(--muted)}
a.btn{display:inline-block;padding:14px 28px;border-radius:16px;background:var(--brand);color:var(--on-brand);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 100" width="98" height="100" aria-hidden="true"><g transform="translate(0 0) scale(1) translate(-11 -10)"><defs><clipPath id="a4"><rect x="16" y="10" width="30" height="100" rx="15" transform="rotate(8 31.0 60.0)"/></clipPath></defs><rect x="16" y="10" width="30" height="100" rx="15" transform="rotate(8 31.0 60.0)" fill="#1F5DB3"/><circle cx="69" cy="50" r="40" fill="#2BB3E0"/><g clip-path="url(#a4)"><circle cx="69" cy="50" r="40" fill="#8FD97F"/></g></g></svg>
<h1>Страница не найдена</h1>
<p>Такой страницы нет или она переехала. Вернитесь на главную — всё самое важное там.</p>
<a class="btn" href="https://prostplanetevo-sudo.github.io/praxis/">На главную Praxis</a>
</main>
</body>
</html>
